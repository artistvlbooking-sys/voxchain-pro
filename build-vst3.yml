# .github/workflows/build-vst3.yml
# Сборка готового VST3 в облаке GitHub (БЕЗ установки Visual Studio на твой ПК!)
name: Build VoxChain Pro VST3 (Windows x64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (JUCE 8 + VST3)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 Plugin
        run: cmake --build build --config Release --target VoxChainPro_VST3

      - name: Upload Ready-to-Use VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxChainPro-Windows-VST3
          path: build/VoxChainPro_artefacts/Release/VST3/VoxChain Pro Modular.vst3